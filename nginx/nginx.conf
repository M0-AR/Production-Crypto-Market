# Single public entrypoint. Frontend + backend are NOT exposed directly in prod.
# Scale rule: stateless backends behind this LB; nginx healthchecks pull dead targets in ~30s.
# Draining: `docker compose up -d --no-deps --build backend` — nginx retries next upstream.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  sendfile on;
  keepalive_timeout 65;

  upstream frontend_upstream { server frontend:3000 max_fails=2 fail_timeout=15s; }
  upstream backend_upstream { server backend:4000 max_fails=2 fail_timeout=15s; }

  # Rate-limit zones: ticket-sale spike protection (5pm Friday rule)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  # Rejections must speak 429 (retryable), never nginx's default 503 (looks like outage).
  limit_req_status 429;
  limit_conn_status 429;

server {
  listen 80;
  server_name _;

  # health for external uptime monitors (UptimeRobot/BetterUptime)
  location /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # Security headers (sellable checklist)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Gzip for HTML/JSON (Next standalone already compresses, this covers API)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # API -> NestJS (auth gets stricter limit)
  location /api/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # Everything else -> Next.js (RSC streaming preserved)
  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }
}
} # end http
