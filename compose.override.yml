# compose.override.yml — DEV ONLY, auto-loaded with `docker compose up`.
# Never applied in prod (`docker compose -f docker-compose.yml up`).
# Adds: host ports for DB/tools, bind mounts for HMR, single replicas, debug logs.
services:
  nginx:
    ports: ["8080:80"] # avoid clashing with local 80 in dev

  frontend:
    build:
      target: dev
    ports: ["3000:3000"]
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BACKEND_INTERNAL_URL: http://backend:4000
    command: ["npm", "run", "dev", "--", "-p", "3000", "-H", "0.0.0.0"]

  backend:
    build:
      target: dev
    ports: ["4000:4000", "9229:9229"]
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/prisma:/app/prisma:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: ["npm", "run", "start:dev"]

  worker:
    build:
      target: dev
    command: ["npm", "run", "worker:dev"]

  # NOTE: passwords stay in secrets/*.txt in BOTH envs (single source of truth).
  # The override must NOT set POSTGRES_PASSWORD — base already sets POSTGRES_PASSWORD_FILE
  # and the image errors when both are set ("both ... are exclusive").
  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]
